version: "3"

tasks:
  copy-to-build:
    cmds:
      - scp Dockerfile green-machine.ts:/home/kube/repos/polite-cicd
      - scp Taskfile.yaml green-machine.ts:/home/kube/repos/polite-cicd
      - scp -r scripts/ green-machine.ts:/home/kube/repos/polite-cicd
    silent: false

  docker-build:
    cmds:
      - docker build --no-cache -t politeauthority/polite-cicd .
    silent: false

  # push:
  #   cmds:
  #     - docker build -t politeauthority/polite-cicd:{{.CICD_TAG}} .
  #     - echo "Completed build politeauthority/polite-cicd:{{.CICD_TAG}}"
  #   silent: false

  build-push:
    desc: Build amd64 image on M1, increment patch version, and push to Harbor
    vars:
      NEW_VERSION:
        sh: awk -F. '{print $1"."$2"."$3+1}' VERSION
      REGISTRY: harbor.squid-ink.us
      IMAGE: politeauthority/polite-cicd
    cmds:
      - echo "Building {{.REGISTRY}}/{{.IMAGE}}:{{.NEW_VERSION}} for linux/amd64..."
      - docker buildx build --platform linux/amd64 --no-cache -t {{.REGISTRY}}/{{.IMAGE}}:{{.NEW_VERSION}} -t {{.REGISTRY}}/{{.IMAGE}}:latest --push .
      - echo "{{.NEW_VERSION}}" > VERSION
      - echo "Done! Pushed {{.REGISTRY}}/{{.IMAGE}}:{{.NEW_VERSION}} and :latest"
    silent: false

  # The Node variant (Dockerfile.node) — stocky-frontend's CI image. Tagged with
  # the same version as the polite-cicd it is built FROM, so the pair is always
  # legible: polite-cicd-node:0.0.16 is polite-cicd:0.0.16 plus Node.
  # Run this AFTER build-push, so the base tag it references already exists.
  build-push-node:
    desc: Build and push the Node variant (polite-cicd + Node 22) for linux/amd64
    vars:
      VERSION:
        sh: cat VERSION
      REGISTRY: harbor.squid-ink.us
      IMAGE: politeauthority/polite-cicd-node
    cmds:
      - echo "Building {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}} FROM polite-cicd:{{.VERSION}} ..."
      - |
        docker buildx build --platform linux/amd64 \
          --build-arg CICD_VERSION={{.VERSION}} \
          -f Dockerfile.node \
          -t {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}} \
          -t {{.REGISTRY}}/{{.IMAGE}}:latest \
          --push .
      - echo "Done! Pushed {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}} and :latest"
    silent: false

  get-version:
    cmds:
      - cat VERSION
    silent: true

  dev-run:
    cmds:
      - docker run --name="polite-cicd" -d politeauthority/polite-cicd:{{.CICD_TAG}} tail -f /dev/null
    silent: false

  dev-exec:
    cmds:
      - docker exec -it polite-cicd bash
    silent: false
